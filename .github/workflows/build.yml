name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 1.19.2-forge
            loader: forge
            java: '21'
          - project: 1.20.1-forge
            loader: forge
            java: '21'
          - project: 1.20.1-fabric
            loader: fabric
            java: '21'
          - project: 1.21.1-neoforge
            loader: neoforge
            java: '21'
          - project: 1.21.1-fabric
            loader: fabric
            java: '21'
          - project: 26.1.2-neoforge
            loader: neoforge
            java: '25'
          - project: 26.1.2-fabric
            loader: fabric
            java: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew :${{ matrix.project }}:build

      - name: Export Forge production artifact path
        if: matrix.loader == 'forge'
        id: forge_production
        run: ./gradlew :${{ matrix.project }}:exportProductionJarPath

      - name: Upload Forge production artifact
        if: matrix.loader == 'forge'
        uses: actions/upload-artifact@v7
        with:
          name: polyglottooltip-${{ matrix.project }}
          path: ${{ steps.forge_production.outputs.path }}
          if-no-files-found: error
