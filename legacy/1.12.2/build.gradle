plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.36'
    id 'net.minecraftforge.renamer' version '1.1.7'
    id 'com.gradleup.shadow' version '9.4.0'
}

group = 'com.starskyxiii.polyglottooltip'
version = '2.0'
base.archivesName = 'polyglottooltip-1.12.2-forge'
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

sourceSets.main.java {
    srcDir '../../src/main/java'
    include 'com/starskyxiii/polyglottooltip/legacy/**'
    include 'com/starskyxiii/polyglottooltip/core/LanguageCodePolicy.java'
    include 'com/starskyxiii/polyglottooltip/core/SecondaryLanguagePolicy.java'
    include 'com/starskyxiii/polyglottooltip/core/ChineseScriptPolicy.java'
}

minecraft {
    mappings channel: 'srg', version: '1.12.2'
    runs {
        register('client') {
            workingDir.convention layout.projectDirectory.dir('run')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://cursemaven.com' }
    mavenCentral()
}

configurations { bundled }

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.12.2-14.23.5.2864')
    implementation 'com.github.houbb:opencc4j:1.14.0'
    bundled('com.github.houbb:opencc4j:1.14.0') { transitive = false }
    bundled('com.github.houbb:heaven:0.13.0') { transitive = false }
    bundled('com.github.houbb:nlp-common:0.0.5') { transitive = false }
    testImplementation 'junit:junit:4.13.2'
}

renamer.mappings.from minecraft.dependency.toSrgFile

tasks.named('processResources') {
    from('../../src/main/resources/META-INF') {
        include 'LICENSE-PolyglotTooltip.txt', 'LICENSE-Apache-2.0.txt', 'THIRD-PARTY-NOTICES.txt'
        into 'META-INF'
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
}

tasks.named('shadowJar') {
    configurations = [project.configurations.bundled]
    archiveClassifier = 'shaded-dev'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
    relocate 'com.github.houbb.opencc4j', 'com.starskyxiii.polyglottooltip.shadow.opencc4j'
    relocate 'com.github.houbb.heaven', 'com.starskyxiii.polyglottooltip.shadow.heaven'
    relocate 'com.github.houbb.nlp', 'com.starskyxiii.polyglottooltip.shadow.nlp'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**', 'module-info.class'
    exclude 'LICENSE.txt', 'README.md'
}

def productionJar = renamer.classes(tasks.named('shadowJar')) {
    archiveClassifier = ''
}

tasks.named('build') { dependsOn productionJar }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnit() }
